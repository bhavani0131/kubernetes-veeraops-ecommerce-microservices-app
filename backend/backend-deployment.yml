spec:
  template:
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: backend-container
          image: 695454131301.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:98af46d3fbf99ee45b390fb08659cc78a1ff4dc8
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 904557616759.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:cbd435faf85ccf163f94ceff70cb7364b7605c08
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
